[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cr-providers"
version = "0.1.0"
description = "Per-vendor ASR backend adapters for clear-record, behind a single interface (Apple Metal, NVIDIA CUDA/Vulkan, AMD ROCm/Vulkan)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "cr-core",
]

# This member is a uv workspace member and depends on a sibling member; pin the
# dependency to the in-workspace version.
[tool.uv.sources]
cr-core = { workspace = true }

# Optional, vendor-specific transcription stacks. These are NOT installed by a
# default `uv sync` — they are activated by name so the core stays backend-
# agnostic and a clean CI/dev env does not need a GPU framework.
#
#   uv sync --all-packages --extra apple     (Apple: system whisper-cli + Metal)
#   uv sync --all-packages --extra nvidia    (NVIDIA: system stack, see below)
#   uv sync --all-packages --extra amd       (AMD Radeon: system stack, see below)
#   uv sync --all-packages --extra all       (everything that has Python deps)
#
# See docs/adr/0005-transcription-backend-strategy.md. No backend is required;
# a backend is only usable when its runtime checks are satisfied (see
# `cr_providers.base.Backend.available()`).
#
# Every family uses the *system* `whisper-cli` plus a ggml backend plugin
# (macOS: Homebrew `whisper-cpp` + `ggml-metal`; Linux: e.g. Arch `whisper-cpp`
# + `ggml-cuda`/`ggml-vulkan`/`ggml-hip`), because no PyPI wheel ships a
# GPU-accelerated ggml backend. So `apple`, `nvidia` and `amd` all carry no
# Python dependency and their extras are no-op markers; `available()` probes the
# CLI, the plugin, the platform and (on Linux) the vendor GPU device.
[project.optional-dependencies]
apple = []
nvidia = []
amd = []
all = []

[tool.hatch.build.targets.wheel]
packages = ["src/cr_providers"]
