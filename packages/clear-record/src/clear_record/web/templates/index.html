{% extends "base.html" %}

{% block body %}
<aside>
  <strong>Projects</strong>
  <div id="projects" hx-get="/ui/projects" hx-trigger="load" hx-swap="innerHTML"></div>

  <form class="stack"
        hx-post="/ui/projects"
        hx-target="#projects"
        hx-swap="innerHTML"
        hx-on::after-request="if (event.detail.successful) this.reset()">
    <input name="name" placeholder="New project name" required>
    <button class="primary" type="submit">Add project</button>
  </form>
</aside>

<section id="detail">
  <div class="empty">Select or create a project.</div>
</section>
{% endblock %}
