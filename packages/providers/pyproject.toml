[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cr-providers"
version = "0.1.0"
description = "Per-vendor ASR backend adapters for clear-record, behind a single interface (Apple Metal/CoreML/ANE, NVIDIA CUDA, AMD ROCm/Vulkan)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "cr-core",
]

# This member is a uv workspace member and depends on a sibling member; pin the
# dependency to the in-workspace version.
[tool.uv.sources]
cr-core = { workspace = true }

# Optional, vendor-specific transcription stacks. These are NOT installed by a
# default `uv sync` — they are activated by name so the core stays backend-
# agnostic and a clean CI/dev env does not need a GPU framework.
#
#   uv sync --all-packages --extra apple     (Apple Silicon: whisper.cpp/Metal)
#   uv sync --all-packages --extra nvidia    (NVIDIA: faster-whisper/CUDA)
#   uv sync --all-packages --extra amd       (AMD Radeon: system stack, see below)
#   uv sync --all-packages --extra all       (apple + nvidia)
#
# See docs/adr/0005-transcription-backend-strategy.md. No backend is required;
# a backend is only usable when its runtime checks are satisfied (see
# `cr_providers.base.Backend.available()`).
#
# AMD is the exception to the "extra installs the stack" rule: no PyPI wheel
# ships a Vulkan/HIP ggml backend, so `amd` carries no Python dependency. The
# capability comes from the *system* `whisper-cli` plus a ggml GPU backend
# plugin (e.g. Arch `whisper-cpp` + `ggml-vulkan`); `available()` probes both.
[project.optional-dependencies]
apple = ["pywhispercpp>=1.1.3"]
nvidia = ["faster-whisper>=1.1.0"]
amd = []
all = ["pywhispercpp>=1.1.3", "faster-whisper>=1.1.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/cr_providers"]
