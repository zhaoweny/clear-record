{# The one guided agent flow, reached again from Setup; /web/setup/agent and
   /web/settings/agent render the same panel, so there is no second copy. The link
   is the discoverable entry point to the standalone Agent page. #}
<div id="agent-setup" hx-get="/web/ui/agent-setup" hx-trigger="load" hx-swap="innerHTML">
  <div class="muted">{{ tr("Loading agent setup…") }}</div>
</div>
<p class="muted settings-note">
  <a href="/web/setup/agent">{{ tr("Open the agent flow as a page") }}</a>
</p>
