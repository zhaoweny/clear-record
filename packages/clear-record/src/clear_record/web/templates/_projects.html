<ul class="projects">
  {% for row in projects %}
  {# htmx's default trigger is a click; the extra keyup keeps the row reachable
     by keyboard now that it is a focusable, button-like list item. #}
  <li class="project" tabindex="0" role="button"
      hx-get="/ui/projects/{{ row.project.slug }}"
      hx-trigger="click, keyup[key=='Enter']"
      hx-target="#detail"
      hx-swap="innerHTML">
    <span class="project-name">{{ row.project.name }}</span>
    <span class="count">{{ row.term_count }}</span>
  </li>
  {% else %}
  <li class="empty">No projects yet.</li>
  {% endfor %}
</ul>
