[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[project]
name = "cr-cli"
version = "0.1.1.dev0"
description = "CLI implementation (`cr_cli`) for clear-record; the `clear-record` command itself is provided by the `clear-record` facade package."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "zhaoweny", email = "zhaoweny@users.noreply.github.com" }]
keywords = ["cli", "transcription", "audio", "speech-to-text", "asr"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Environment :: Console",
    "Topic :: Utilities",
]
requires-python = ">=3.12"
dependencies = [
    "cr-core==0.1.1.dev0",
    "cr-engine==0.1.1.dev0",
    "cr-providers==0.1.1.dev0",
]

[project.urls]
Homepage = "https://github.com/zhaoweny/clear-record"
Repository = "https://github.com/zhaoweny/clear-record"
Issues = "https://github.com/zhaoweny/clear-record/issues"

# This member is a uv workspace member and depends on sibling members; pin the
# dependencies to the in-workspace versions.
[tool.uv.sources]
cr-core = { workspace = true }
cr-engine = { workspace = true }
cr-providers = { workspace = true }
