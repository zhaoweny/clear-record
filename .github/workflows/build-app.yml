name: build-app

# Builds the double-clickable desktop app (PyInstaller) for macOS and Windows and
# keeps the results as workflow artifacts. Never published to an index — this
# lane is for handing an average person a file they can run (ADR-0014).
#
# PyInstaller does NOT cross-compile, so each OS builds its own artifact on its
# own runner. Builds are unsigned: see packaging/pyinstaller/README.md for the
# Gatekeeper / SmartScreen first-run notes.
on:
  workflow_dispatch:
  push:
    tags: ["v[0-9]*"]

permissions:
  contents: read

jobs:
  build:
    name: app (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            artifact: clear-record-macos
          - os: windows-latest
            artifact: clear-record-windows
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - name: Install just
        uses: extractions/setup-just@v4
      - name: Build the app
        run: just app

      - name: Smoke test — the frozen CLI still exposes `web` and `tray` (macOS)
        if: runner.os == 'macOS'
        run: |
          ./dist/clear-record/clear-record --help | grep -q " web "
          ./dist/clear-record/clear-record --help | grep -q " tray "
      - name: Smoke test — the frozen CLI still exposes `web` and `tray` (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (./dist/clear-record/clear-record.exe --help | Select-String -Quiet "web")) { throw "web missing" }
          if (-not (./dist/clear-record/clear-record.exe --help | Select-String -Quiet "tray")) { throw "tray missing" }

      - name: Smoke test — the tray binary is bundled and is the app's entry point (macOS)
        if: runner.os == 'macOS'
        run: |
          test -x dist/clear-record/clear-record-tray
          test "$(plutil -extract CFBundleExecutable raw dist/clear-record.app/Contents/Info.plist)" = "clear-record-tray"
      - name: Smoke test — the tray binary is bundled (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path ./dist/clear-record/clear-record-tray.exe)) { throw "tray binary missing" }

      - name: Package the app bundle (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/clear-record.app clear-record-macos.zip
      - name: Package the onedir app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/clear-record/* -DestinationPath clear-record-windows.zip

      - name: Upload the app artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: clear-record-*.zip
          if-no-files-found: error
