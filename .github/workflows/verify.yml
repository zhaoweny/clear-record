name: verify

# The verify gate is hardware-independent: the Apple/whisper-cli tests fake the
# platform and `subprocess`, so this is green on a plain Linux runner with no
# GPU, no `whisper-cli` and no model weights.
#
# This is also the build-artifact path: after `just verify`, CI builds the dist
# and keeps it as a workflow artifact named with the manifest version,
# `dist-<version>` (no "dev" label — an rc version ships through this path too).
# Dev builds are never published — not to TestPyPI, not to PyPI. TestPyPI is a
# manual release rehearsal (`publish-testpypi.yml`); PyPI is tag-triggered
# (`publish.yml`). See docs/releasing.md.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: just verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install just
        uses: extractions/setup-just@v4
      - name: Run the verify gate
        run: just verify
      - name: Build the dist (wheel + sdist)
        run: just build
      - name: Read the version for the artifact name
        id: version
        run: echo "version=$(uv version --frozen --package clear-record --short)" >> "$GITHUB_OUTPUT"
      - name: Upload the built dist
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ steps.version.outputs.version }}
          path: dist/

  web-assets:
    name: web assets fresh
    runs-on: ubuntu-latest
    # The console's compiled CSS/JS are committed, so they can silently drift
    # from their source; this job rebuilds them and fails on any diff (ADR-0023).
    # It is a SEPARATE job because the guard needs bun: `just verify` stays
    # Node-less, so a contributor who never touches the UI is not blocked.
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install just
        uses: extractions/setup-just@v4
      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - name: Guard — the committed assets match the front-end source
        run: just web-assets-check
