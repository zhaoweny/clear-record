[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[project]
name = "cr-engine"
version = "0.1.1.dev0"
description = "Audio signal processing for clear-record: loading/decoding, cross-correlation alignment, and segment reconciliation."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "zhaoweny", email = "zhaoweny@users.noreply.github.com" }]
keywords = ["audio", "signal-processing", "alignment", "cross-correlation", "resampling"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Scientific/Engineering",
]
requires-python = ">=3.12"
dependencies = [
    "cr-core==0.1.1.dev0",
    "numpy>=2.0",
    "soundfile>=0.12",
]

[project.urls]
Homepage = "https://github.com/zhaoweny/clear-record"
Repository = "https://github.com/zhaoweny/clear-record"
Issues = "https://github.com/zhaoweny/clear-record/issues"

[tool.uv.sources]
cr-core = { workspace = true }
