# clear-record-workspace — uv workspace root.
#
# Workspace members under packages/:
#   packages/core         -> dist "cr-core",      import "cr_core"      (backend-agnostic application core)
#   packages/engine       -> dist "cr-engine",    import "cr_engine"    (audio I/O, alignment, reconcile)
#   packages/providers    -> dist "cr-providers", import "cr_providers" (per-vendor ASR backend adapters)
#   packages/cli          -> dist "cr-cli",       import "cr_cli"       (the `clear-record` CLI implementation)
#   packages/clear-record -> dist "clear-record", import "clear_record" (facade / public command; forwards to cr-cli)
#
# See docs/adr/0004-uv-workspace-layout.md,
# docs/adr/0009-packaging-and-distribution.md and
# docs/adr/0010-build-backend-uv-build.md.
#
# The root is a virtual project (never built/published); only the workspace
# members are real packages. Its name must differ from every member, so it is
# `clear-record-workspace` — the published `clear-record` name belongs to the
# facade dist in packages/clear-record/.

[project]
name = "clear-record-workspace"
version = "0.1.1.dev0"
description = "Local-first open-source multitrack transcription and record-reconstruction: from many recordings to one clear record (workspace root)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

# The root references workspace members through the convenience extras above, so
# pin those member dependencies to the in-workspace versions.
[tool.uv.sources]
cr-core = { workspace = true }
cr-engine = { workspace = true }
cr-providers = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
    "trove-classifiers>=2026.6.1",
]

# Convenience extras that mirror the cr-providers backend extras, so a single
# `--extra <backend>` switch stays valid in both `uv sync` and `uv run`. These
# mirror ADR-0005.
#
# `apple`, `nvidia` and `amd` all intentionally resolve no Python deps: every
# path uses the system `whisper-cli` + a ggml GPU plugin, so the backend extras
# are no-op markers (see cr-providers/pyproject.toml).
[project.optional-dependencies]
apple = ["cr-providers[apple]==0.1.1.dev0"]
nvidia = ["cr-providers[nvidia]==0.1.1.dev0"]
amd = ["cr-providers[amd]==0.1.1.dev0"]
all = ["cr-providers[all]==0.1.1.dev0"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Ruff's default rule set; extend deliberately per-slice later.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = [
    "packages/core/tests",
    "packages/engine/tests",
    "packages/providers/tests",
    "packages/cli/tests",
]
