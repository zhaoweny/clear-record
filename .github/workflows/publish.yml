name: publish

# Publish the five workspace dists (cr-core, cr-engine, cr-providers, cr-cli,
# clear-record) to PyPI on a release tag. PyPI receives stable releases
# (`vX.Y.Z`) and release candidates (`vX.Y.ZrcN`). A candidate is a PEP 440
# pre-release, so installers only pick it up when they opt in: `pip`/`uv` select
# it only with `--pre`, an explicit pin, or when no stable version satisfies the
# range. Dev builds (`vX.Y.Z.devN`) are never published — they are CI workflow
# artifacts from `verify.yml`. The tag filter below excludes dev tags, and the
# publish job also refuses a manifest version carrying `.devN`.
#
# The release commit is qualified first by a manual TestPyPI rehearsal
# (`publish-testpypi.yml`); see docs/releasing.md.
#
# Prep-only notes for maintainers:
#
#   (a) OIDC trusted publishing — no API tokens and no repository secrets. The
#       publish job requests a short-lived OIDC token from GitHub via
#       `id-token: write`, scoped to the `pypi` environment; PyPI verifies the
#       workflow identity instead.
#   (b) Each PyPI project needs a one-time pending publisher configured by hand
#       (owner `zhaoweny`, repo `clear-record`, workflow `publish.yml`,
#       environment `pypi`). See docs/releasing.md.
#   (c) The `pypi` GitHub environment is the deployment gate: require a reviewer
#       there and every publish waits for a human approval before the upload.
#   (d) `v0.1.0` was a source-only OSS tag and was never uploaded; the first
#       stable PyPI release is `v0.1.1`, tag-driven. `workflow_dispatch` survives only
#       as an emergency hatch, and the publish job refuses to run unless the
#       manifest is publishable (stable or rc, but never a dev version) and the
#       checked-out ref is a tag whose `v<version>` matches the manifest.
on:
  push:
    tags:
      - "v[0-9]*"
      - "!v[0-9]*.dev*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build dists
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install just
        uses: extractions/setup-just@v4
      - name: Run the verify gate
        run: just verify
      - name: Build all workspace wheels + sdists
        run: just build
      - name: Smoke-install the built facade in a clean venv
        run: |
          version="$(uv run --frozen scripts/bump-version.py --show)"
          uv venv .smoke-venv
          uv pip install --python .smoke-venv --find-links dist "clear-record==${version}"
          .smoke-venv/bin/clear-record --help
      - name: Upload dists
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write # trusted publishing
    steps:
      - uses: actions/checkout@v5
      - name: Guard — refuse a dev version
        run: |
          if ! out="$(python3 scripts/bump-version.py --check-publishable 2>&1)"; then
            echo "::error::${out}"; exit 1
          fi
          echo "OK: manifest version ${out} is a release candidate or stable release"
      - name: Guard — the checked-out ref must be the matching release tag
        run: |
          version="$(python3 scripts/bump-version.py --show)"
          ref="${GITHUB_REF_NAME}"
          if [ "v${version}" != "${ref}" ]; then
            echo "::error::ref '${ref}' does not match manifest version 'v${version}'; refusing to publish"
            exit 1
          fi
          echo "OK: tag ${ref} matches manifest version ${version}"
      - name: Download dists
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
