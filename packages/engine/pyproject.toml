[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[project]
name = "cr-engine"
version = "0.1.0"
description = "Audio signal processing for clear-record: loading/decoding, cross-correlation alignment, and segment reconciliation."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "cr-core==0.1.0",
    "numpy>=2.0",
    "soundfile>=0.12",
]

[tool.uv.sources]
cr-core = { workspace = true }
