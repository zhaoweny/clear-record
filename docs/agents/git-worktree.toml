# docs/agents/git-worktree.toml — geometry and authority for the agentic
# git workflow. Consumed at dispatch and landing time by the git-worktree
# skill configured in your local agent setup.
# Missing or unparseable => the skill prints a warning and uses the
# conservative defaults documented in the skill (see its setup.md).

[worktrees]
# Worktree checkout directory, relative to the repo root. Must stay gitignored.
worktree_dir = ".wt"

# Shape of agent branch names. {slug} = task slug (always present).
# Add {user} (an operator path segment) only when several operators share one
# repo; omit it for solo trees and GitHub-fork workflows.
branch_template = "agents/{slug}"

[gates]
# The command the run's verify gate runs, in the tree it certifies: CI's `verify`
# job, which is `just verify` (sync --locked, ruff check + format-check, pytest).
#
# The freshness guards (`just web-assets-check`, `just i18n-check`) are
# deliberately NOT here. Both read `git status` over their artifact's paths, and
# `gwt integrate` runs this gate with the ticket's squash-merge *staged* — so a
# ticket that touches `web/static/` or `locales/` is refused for the change the
# merge itself staged, not for anything stale (measured 2026-09-23: a fresh build
# reproduced the staged `app.css` byte for byte and the guard still failed). The
# guards are the batch gate's job, run in the integration tree on committed
# content; `docs/agents/shared-artifacts.toml` declares both artifacts, so a
# merge that touches one runs its guard there. The durable fix — a guard that
# compares a fresh build against the *index* rather than HEAD — is a proposal for
# the owner, not a change to make under a release run.
verify = "just verify"

[control]
# Who performs the final review-and-land on main:
#   "orchestrator" — the running main agent verifies (verify gate) then lands.
#   "human"        — agents push + report; a human reviews and lands.
landing_authority = "human"

[limits]
# Refusals, not targets: a run stops dispatching at these.
min_free_gb   = 5
max_worktrees = 4
