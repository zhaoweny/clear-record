# docs/agents/git-worktree.toml — geometry and authority for the agentic
# git workflow. Consumed at dispatch and landing time by the git-worktree
# skill configured in your local agent setup.
# Missing or unparseable => the skill prints a warning and uses the
# conservative defaults documented in the skill (see its setup.md).

[worktrees]
# Worktree checkout directory, relative to the repo root. Must stay gitignored.
worktree_dir = ".wt"

# Shape of agent branch names. {slug} = task slug (always present).
# Add {user} (an operator path segment) only when several operators share one
# repo; omit it for solo trees and GitHub-fork workflows.
branch_template = "agents/{slug}"

[gates]
# The command the run's verify gate runs, in the tree it certifies. `gwt
# integrate` runs it in the integration tree before it stages a merge, and the
# batch checkpoint runs the same command in the same tree. Absent, no gate runs
# and every integration logs `gate="none"` while nothing was checked; this repo
# runs these three as separate CI jobs, so the gate here is the compound.
#
# Run note, 2026-09-23 (the v0.3.0 run): this gate was narrowed to `just verify`
# mid-flight because `check_web_assets.py` read `git status --porcelain`, which
# counts the squash-merge's own *staged* assets as stale — so a ticket touching
# `web/static/` (or `locales/`, for the sibling guard) was refused for the change
# the merge itself staged; measured, a fresh build reproduced the staged
# `app.css` byte for byte and the guard still failed. The run repaired the guard
# instead (it compares the worktree against the index, plus untracked files — the
# question its own docstring asks), which makes the compound safe here again, so
# the narrowing is undone. Recorded so the next run that meets this refusal reads
# it as history instead of rediscovering it.
verify = "just verify && just web-assets-check && just i18n-check"

[control]
# Who performs the final review-and-land on main:
#   "orchestrator" — the running main agent verifies (verify gate) then lands.
#   "human"        — agents push + report; a human reviews and lands.
landing_authority = "human"

[limits]
# Refusals, not targets: a run stops dispatching at these.
# Raised 4 -> 21 on 2026-09-25 at the owner's direction: four integration trees,
# sixteen feature/ticket trees, plus the control-plane main checkout.
min_free_gb   = 5
max_worktrees = 21
