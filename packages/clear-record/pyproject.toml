[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[project]
name = "clear-record"
version = "0.1.1"
description = "Local-first multitrack transcription and record reconstruction: from many recordings to one clear record."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "zhaoweny", email = "zhaoweny@users.noreply.github.com" }]
keywords = [
    "cli",
    "transcription",
    "audio",
    "speech-to-text",
    "asr",
    "pipeline",
    "reconciliation",
    "signal-processing",
    "alignment",
    "whisper",
    "cuda",
    "rocm",
    "metal",
    "backend",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing",
    "Environment :: Console",
    "Topic :: Utilities",
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "soundfile>=0.12",
]

[project.urls]
Homepage = "https://github.com/zhaoweny/clear-record"
Repository = "https://github.com/zhaoweny/clear-record"
Issues = "https://github.com/zhaoweny/clear-record/issues"

# Backend extras are no-op markers (every path uses the system `whisper-cli` +
# a ggml plugin); they exist so `--extra <backend>` stays a valid switch. See
# ADR-0005.
#
# `web` carries the web console's stack (FastAPI + uvicorn). It is deliberately
# NOT a base dependency: the web/service *code* ships inside this one wheel (so
# there is no second dist to publish — ADR-0013), but a plain CLI install does
# not pay for the stack. `web` is registered as a subcommand unconditionally and
# gives an actionable hint when the extra is absent. The MCP SDK will get its own
# `agents` extra when the MCP server lands (no speculative dependency now).
[project.optional-dependencies]
apple = []
nvidia = []
amd = []
all = []
web = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]
# `tray` is the native desktop entry point (PySide6). PySide2 is not an option:
# its wheels stop at Python 3.10 and this project requires >= 3.12.
tray = ["pyside6>=6.7"]

[project.scripts]
clear-record = "clear_record.cli:main"

# Optional surfaces register their subcommands here so the CLI never imports
# them (ADR-0013). The bundled web console is the first provider.
[project.entry-points."clear_record.commands"]
web = "clear_record.web:register"
tray = "clear_record.tray:register"
