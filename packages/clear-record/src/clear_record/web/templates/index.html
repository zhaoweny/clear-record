{% extends "base.html" %}

{% block body %}
<aside class="sidebar">
  <h2 class="sidebar-title">{{ tr("Projects") }}</h2>
  <div id="projects" hx-get="/ui/projects" hx-trigger="load" hx-swap="innerHTML"></div>

  <form class="stack"
        hx-post="/ui/projects"
        hx-target="#projects"
        hx-swap="innerHTML"
        hx-on::after-request="if (event.detail.successful) this.reset()">
    <input name="name" placeholder="{{ tr("New project name") }}" required>
    <button class="primary" type="submit">{{ tr("Add project") }}</button>
  </form>
</aside>

<section id="detail" class="content">
  <div class="empty">{{ tr("Select or create a project.") }}</div>
</section>
{% endblock %}
