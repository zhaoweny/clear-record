# Babel extraction config — **build-time only** (see docs/i18n.md).
#
# Message IDs are the English source strings; `tr()`/`trn()` are the shorthand.
# Babel does not know those names by default, so `scripts/i18n.py` (and therefore
# `just i18n-extract` / `i18n-check`) passes them as extraction keywords:
#
#     --keyword tr --keyword trn:1,2
#
# `trn:1,2` tells Babel the first two arguments are the singular and the plural
# (the third argument, the count, is supplied by the call site). This file only
# maps a file pattern to an extractor; `jinja2` comes from Jinja2's registered
# `babel.extractors` entry point.
[python: **.py]
[jinja2: **.html]
