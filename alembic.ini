# The registry's schema history, for the developer CLI.
#
# The application does not read this file: `clear_record.service.store` builds
# the same configuration in code and migrates when it opens a registry
# (ADR-0030), which is how an installed wheel migrates with no `.ini` beside it.
# This file is what makes the history writable from a checkout:
#
#   uv run alembic -x db=/path/to/registry.sqlite3 upgrade head
#   uv run alembic revision -m "one active run per meeting"
#
# A revision here is upgraded, never unwound: `downgrade()` raises, and the
# registry's migration is forward-only.

[alembic]
# A package resource, not a filesystem path — the member is installed editable
# from a checkout and resolves from `site-packages` once installed, so one value
# serves both. `_SCRIPT_LOCATION` in `service/store.py` carries the same value,
# and `tests/service/test_store.py` asserts the two agree.
script_location = clear_record.service:migrations

# Run `env.py` for `alembic revision` too, not only for `upgrade`.
#
# That is what lets the revision id be pinned to the chain's own numbering:
# `env.py`'s `process_revision_directives` names a new revision after the
# newest one (0010, 0011…), where Alembic's default is a hex uuid. The numbering
# is the retired ladder's, and `store._LADDER_VERSION` is the number a
# pre-Alembic build compares itself with, so one hex id in this chain is the
# landmine the pin exists for. `env.py` reaches no registry in this mode: the bind
# its hooks need is a scratch in-memory connection.
revision_environment = true
