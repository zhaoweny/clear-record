[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[project]
name = "clear-record"
version = "0.1.1.dev0"
description = "Public install name for the `clear-record` CLI (a facade over cr-cli)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "zhaoweny", email = "zhaoweny@users.noreply.github.com" }]
keywords = ["cli", "transcription", "audio", "speech-to-text", "asr"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Environment :: Console",
    "Topic :: Utilities",
]
requires-python = ">=3.12"
dependencies = ["cr-cli==0.1.1.dev0"]

[project.urls]
Homepage = "https://github.com/zhaoweny/clear-record"
Repository = "https://github.com/zhaoweny/clear-record"
Issues = "https://github.com/zhaoweny/clear-record/issues"

# Backend extras are no-op markers, mirroring cr-providers and the workspace
# root (every path uses the system `whisper-cli` + a ggml plugin). See ADR-0005.
[project.optional-dependencies]
apple = []
nvidia = []
amd = []
all = []

[project.scripts]
clear-record = "clear_record:main"

[tool.uv.sources]
cr-cli = { workspace = true }
