{# One add-project form, shared by the workspace and the project page sidebar,
   so the two cannot drift; both swap the fragment into `#projects`. #}
<form class="stack add-project"
      hx-post="/ui/projects"
      hx-target="#projects"
      hx-swap="innerHTML"
      hx-on::after:request="if (event.detail.ctx.response.status === 200) this.reset()">
  <input name="name" placeholder="{{ tr('New project name') }}" required>
  <button class="primary" type="submit">{{ tr("Add project") }}</button>
</form>
