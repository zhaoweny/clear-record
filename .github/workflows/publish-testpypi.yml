name: publish-testpypi

# Manual release rehearsal to TestPyPI — no automatic trigger.
#
#   * There is no push/tag trigger. Dispatch this workflow by hand on the exact
#     commit that will become the release tag; it publishes the dist at
#     whatever version the published member carries. This lane carries release
#     candidates (`X.Y.ZrcN`, cut with `just bump-rc`) and the final stable
#     rehearsal (`X.Y.Z`, via `just set-version X.Y.Z`), so the exact commit is
#     qualified before the real tag. A dev version is refused (see the guard
#     below). `publish.yml` then runs on the real tag and publishes the same
#     candidate (or the stable release) to PyPI.
#   * TestPyPI is a SEPARATE index with its OWN one-time pending publisher
#     (distinct from the PyPI one in `publish.yml`): same owner/repo, workflow
#     `publish-testpypi.yml`, environment `testpypi`. Publishing `X.Y.Z` here
#     does not consume `X.Y.Z` on PyPI, so the same version can still be
#     released for real.
#   * Dev builds never publish anywhere: they are CI workflow artifacts from
#     `verify.yml` on every push/PR. See docs/releasing.md.
#   * No API tokens and no repository secrets: publishing uses OIDC trusted
#     publishing (`id-token: write`). The `testpypi` environment is where the
#     human approval gate belongs — require a reviewer there.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build the dist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - name: Guard — refuse a dev version
        run: |
          version="$(uv version --frozen --package clear-record --short)"
          case "$version" in
            *.dev*)
              echo "::error::manifest version '${version}' is a dev version; dev builds are CI artifacts, so publish an X.Y.ZrcN release candidate or a stable X.Y.Z release"
              exit 1
              ;;
          esac
          echo "OK: manifest version ${version} is a release candidate or stable release"
      - name: Install just
        uses: extractions/setup-just@v4
      - name: Run the verify gate
        run: just verify
      - name: Build the dist (wheel + sdist)
        run: just build
      - name: Smoke-install the built dist in a clean venv
        run: |
          version="$(uv version --frozen --package clear-record --short)"
          uv venv .smoke-venv
          uv pip install --python .smoke-venv --find-links dist "clear-record==${version}"
          .smoke-venv/bin/clear-record --help
      - name: Upload the dist
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write # trusted publishing
    steps:
      - name: Download the dist
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Publish rehearsal to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
