[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[project]
name = "cr-core"
version = "0.1.1.dev0"
description = "Backend-agnostic application core for clear-record: the audio->record pipeline domain and shared services (no vendor/ML-framework code)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "zhaoweny", email = "zhaoweny@users.noreply.github.com" }]
keywords = ["transcription", "audio", "pipeline", "reconciliation", "record-reconstruction"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing",
]
requires-python = ">=3.12"
dependencies = []

[project.urls]
Homepage = "https://github.com/zhaoweny/clear-record"
Repository = "https://github.com/zhaoweny/clear-record"
Issues = "https://github.com/zhaoweny/clear-record/issues"
