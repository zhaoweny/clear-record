# clear-record-workspace — uv workspace root.
#
# One workspace member is published:
#   packages/clear-record -> dist "clear-record", import "clear_record"
#     with four internal layers as subpackages:
#       clear_record.core       backend-agnostic application core (no third-party deps)
#       clear_record.engine     audio I/O, alignment, reconcile (numpy, soundfile)
#       clear_record.providers  per-vendor ASR backend adapters
#       clear_record.cli        the `clear-record` command implementation
#
# The workspace is kept (rather than flattened to a root package) so a future
# GUI/MCP member is a new `packages/*` member, not a reparenting.
#
# See docs/adr/0004-uv-workspace-layout.md,
# docs/adr/0009-packaging-and-distribution.md,
# docs/adr/0010-build-backend-uv-build.md and
# docs/adr/0012-single-distribution.md.
#
# The root is a virtual project (never built/published); only the workspace
# members are real packages. Its name must differ from every member, so it is
# `clear-record-workspace` — the published `clear-record` name belongs to the
# member in packages/clear-record/.

[project]
name = "clear-record-workspace"
version = "0.3.0rc1"
description = "Local-first open-source multitrack transcription and record-reconstruction: from many recordings to one clear record (workspace root)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

# The root's aggregate extras reference the single member. The workspace source
# below (`clear-record = { workspace = true }`) supplies it, so the extras need
# no version pin. (The member itself has no `tool.uv.sources` — it depends only
# on numpy/soundfile from PyPI.)
[tool.uv.sources]
clear-record = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.6",
    "ruff>=0.9",
    "trove-classifiers>=2026.6.1",
    # The verify gate exercises the bundled web console, so its optional stack
    # is a dev dependency too — end users get it via the `web` extra instead.
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    # The verify gate exercises the MCP server, so its optional SDK is a dev
    # dependency too — end users get it via the `agents` extra instead.
    "mcp>=2",
]

# The desktop-app build toolchain (PyInstaller), kept out of `dev` so the
# verify environment stays lean. Run it with `just app`. See
# docs/adr/0014-desktop-app-distribution.md.
app = [
    "pyinstaller>=6.0",
]

# The message-catalog toolchain (Babel). Build-time only: `clear_record.core.i18n`
# uses stdlib `gettext` at runtime and never imports Babel. Kept out of `dev` so
# the verify gate stays Babel-free (a contributor who never touches a translation
# can still run `just verify`); the freshness guard runs in its own CI job. See
# docs/i18n.md.
i18n = [
    "babel>=2.14",
    # `pybabel extract` resolves the `jinja2` extractor through an entry point that
    # **Jinja2 itself** registers, so Babel alone is not enough: with Jinja2 absent
    # the guard dies with `ValueError: Unknown extraction method 'jinja2'`. It is a
    # build-time extractor for the templates, never imported at runtime.
    "jinja2>=3.1",
]

# Convenience extras that mirror the single dist's backend extras, so a single
# `--extra <backend>` switch stays valid in both `uv sync` and `uv run`. These
# mirror ADR-0005.
#
# `apple`, `nvidia` and `amd` all intentionally resolve no Python deps: every
# path uses the system `whisper-cli` + a ggml GPU plugin, so the backend extras
# are no-op markers (see packages/clear-record/pyproject.toml). `apple-speech`
# (macOS 26+ `SpeechTranscriber`) is a marker too: its bridge is a Swift helper,
# not a Python package (ADR-0019).
[project.optional-dependencies]
apple = ["clear-record[apple]"]
nvidia = ["clear-record[nvidia]"]
amd = ["clear-record[amd]"]
apple-speech = ["clear-record[apple-speech]"]
all = ["clear-record[all]"]
web = ["clear-record[web]"]
tray = ["clear-record[tray]"]
agents = ["clear-record[agents]"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Ruff's default rule set; extend deliberately per-slice later.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
# Parallel by default: the suite is per-test isolated (tmp_path, monkeypatched
# environment), so workers do not collide, and the gate runs in a fraction of
# the serial time. `--dist loadfile` keeps one module's tests on one worker.
addopts = "-n auto --dist loadfile"
testpaths = [
    "packages/clear-record/tests",
]
markers = [
    "own_setup_marker: the test arranges its own setup version marker (ticket 04)",
]
