[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[project]
name = "clear-record"
version = "0.4.0.dev0"
description = "Local-first multitrack transcription and record reconstruction: from many recordings to one clear record."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "zhaoweny", email = "zhaoweny@users.noreply.github.com" }]
keywords = [
    "cli",
    "transcription",
    "audio",
    "speech-to-text",
    "asr",
    "pipeline",
    "reconciliation",
    "signal-processing",
    "alignment",
    "whisper",
    "cuda",
    "rocm",
    "metal",
    "backend",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing",
    "Environment :: Console",
    "Topic :: Utilities",
]
requires-python = ">=3.12"
# `alembic` and `sqlalchemy` are base dependencies, not extras (ADR-0030): the
# schema's history is Alembic's and the registry migrates at open, and the
# `bench`/`diagnose` entry points ship in the base distribution and reach the
# registry — so the extra-plus-actionable-hint pattern the `web`/`tray`/`agents`
# surfaces use cannot apply here.
#
# `pydantic` is a base dependency for the same reason (ADR-0030): the service
# layer validates the run options where they cross into a run, and every base
# install reaches the registry — `web`'s FastAPI pulled it in, but the base
# distribution declared nothing, so nothing promised it was installed. `web`
# keeps its own `fastapi`, which depends on it anyway.
dependencies = [
    "alembic>=1.13",
    "click>=8.1",
    "numpy>=2.0",
    "platformdirs>=4.0",
    "pydantic>=2.0",
    "soundfile>=0.12",
    "sqlalchemy>=2.0",
]

[project.urls]
Homepage = "https://github.com/zhaoweny/clear-record"
Repository = "https://github.com/zhaoweny/clear-record"
Issues = "https://github.com/zhaoweny/clear-record/issues"

# The `apple`/`nvidia`/`amd` backend extras are no-op markers (each family
# drives the system `whisper-cli` + a ggml plugin); they exist so
# `--extra <backend>` stays a valid switch. See ADR-0005.
#
# `apple-speech` is the macOS 26+ native backend. It is also a no-op marker: the
# bridge is a Swift helper compiled from source shipped in this wheel, so no
# Python dependency (and no `pyobjc` wheel that would fail to build off macOS) is
# introduced. `clear-record backends` reports it unavailable with a reason when
# the OS version or the Swift toolchain is missing. See ADR-0019.
#
# `web` carries the web console's stack (FastAPI + uvicorn). It is deliberately
# NOT a base dependency: the web/service *code* ships inside this one wheel (so
# there is no second dist to publish — ADR-0013), but a plain CLI install does
# not pay for the stack. `web` is registered as a subcommand unconditionally and
# gives an actionable hint when the extra is absent. The MCP SDK's own `agents`
# extra is below, behind the `clear-record mcp` server registered the same way
# (ADR-0017).
[project.optional-dependencies]
apple = []
nvidia = []
amd = []
apple-speech = []
all = []
web = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]
# `tray` is the native desktop entry point (PySide6). PySide2 is not an option:
# its wheels stop at Python 3.10 and this project requires >= 3.12.
tray = ["pyside6>=6.7"]
# `agents` carries the MCP SDK behind the `clear-record mcp` server: the agent
# boundary (ADR-0017). Like `web`/`tray` it is not a base dependency — the code
# ships in this one wheel, a CLI-only install stays audio-only. BYOK: no model
# or provider key is ever bundled or read here.
agents = ["mcp>=2"]

[project.scripts]
clear-record = "clear_record.cli.cli:main"

# Optional surfaces register their subcommands here so the CLI never imports
# them (ADR-0013). The bundled web console is the first provider. `diagnose` is
# not optional (the diagnostics code ships in the base dist), but it registers
# the same way so `clear_record.cli` never imports the service surface either.
[project.entry-points."clear_record.commands"]
bench = "clear_record.service.benchmark:register"
diagnose = "clear_record.service.diagnostics:register"
# The console-credential rescue (`clear-record password`): a service provider for
# the same reason `diagnose` is one — the command opens the registry directly, is
# exactly what a console that cannot be signed into needs, and must not drag the
# web stack (or a running node) in with it (ADR-0013).
auth = "clear_record.service.auth:register"
web = "clear_record.web:register"
tray = "clear_record.tray:register"
mcp = "clear_record.mcp:register"
