[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cr-cli"
version = "0.1.0"
description = "The `clear-record` command-line entry point for clear-record."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "cr-core==0.1.0",
    "cr-engine==0.1.0",
    "cr-providers==0.1.0",
]

# This member is a uv workspace member and depends on sibling members; pin the
# dependencies to the in-workspace versions.
[tool.uv.sources]
cr-core = { workspace = true }
cr-engine = { workspace = true }
cr-providers = { workspace = true }

[project.scripts]
clear-record = "cr_cli.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cr_cli"]
